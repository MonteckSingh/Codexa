<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CODEXA Multi-Calendar & Sprint Engine — Manage custom calendars, customize labels and colors, and schedule client & engineering sprints.">
  <meta name="theme-color" content="#070a10">
  <title>CODEXA — Multi-Calendar &amp; Sprint Engine</title>

  <!-- Google Fonts: Plus Jakarta Sans, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="calendar.css">
</head>
<body>

  <div class="ambient-glow"></div>

  <!-- ==========================================================================
       APP HEADER / TOP CONTROL BAR
       ========================================================================== -->
  <header class="cal-app-header">
    <div class="cal-header-left">
      <button class="action-icon-btn mobile-menu-btn" id="mobileMenuToggle" title="Toggle Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <a href="index.html" class="brand-link" title="Return to CODEXA Home">
        <div class="brand-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </div>
        <span class="brand-title">CODE<span>XA</span></span>
      </a>

      <span class="nav-badge-pill">
        <span style="width:6px; height:6px; border-radius:50%; background:var(--brand-emerald); box-shadow:0 0 6px var(--brand-emerald);"></span>
        Sprint Hub
      </span>

      <!-- Date Period Navigator -->
      <div class="cal-nav-controls">
        <button class="nav-btn" id="prevPeriodBtn" title="Previous (Left Arrow)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="today-btn" id="todayBtn" title="Shortcut: T">Today</button>
        <button class="nav-btn" id="nextPeriodBtn" title="Next (Right Arrow)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="current-period-label" id="currentPeriodLabel">Loading...</div>
    </div>

    <!-- Header Right Actions & View Switcher -->
    <div class="cal-header-right">
      <!-- Search Input -->
      <div class="search-wrapper">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="eventSearchInput" placeholder="Search events (Press /)...">
      </div>

      <!-- View Switcher -->
      <div class="view-switcher" role="tablist">
        <button class="view-btn active" data-view="month" title="Shortcut: M">Month</button>
        <button class="view-btn" data-view="week" title="Shortcut: W">Week</button>
        <button class="view-btn" data-view="day" title="Shortcut: D">Day</button>
        <button class="view-btn" data-view="agenda" title="Shortcut: A">Agenda</button>
        <button class="view-btn" data-view="year" title="Shortcut: Y">Year</button>
      </div>

      <!-- Export ICS -->
      <button class="btn btn-secondary btn-icon-only" id="btnExportData" title="Export to .ICS (Google / Apple Calendar / Outlook)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>

      <!-- Import JSON -->
      <button class="btn btn-secondary btn-icon-only" id="btnImportData" title="Import JSON Backup">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" id="fileImportInput" accept=".json" style="display: none;">

      <!-- Create New Event CTA -->
      <button class="btn btn-primary" id="btnOpenNewEventModal" title="Shortcut: N">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Event
      </button>
    </div>
  </header>

  <!-- ==========================================================================
       MAIN APP LAYOUT: SIDEBAR + VIEWPORT
       ========================================================================== -->
  <div class="cal-app-layout">
    
    <!-- LEFT SIDEBAR: MULTI-CALENDAR MANAGEMENT -->
    <aside class="cal-sidebar" id="calSidebar">
      <!-- Mini Calendar Datepicker -->
      <div class="sidebar-section">
        <div class="mini-cal-container">
          <div class="mini-cal-nav">
            <span class="mini-cal-month" id="miniCalMonthLabel">Month Year</span>
            <div style="display: flex; gap: 4px;">
              <button class="mini-cal-btn" id="miniCalPrevBtn">‹</button>
              <button class="mini-cal-btn" id="miniCalNextBtn">›</button>
            </div>
          </div>
          <div class="mini-cal-grid" id="miniCalGrid"></div>
        </div>
      </div>

      <!-- Custom Calendars Manager -->
      <div class="sidebar-section">
        <div class="sidebar-header-row">
          <span class="sidebar-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            My Calendars
          </span>
          <button class="action-icon-btn" id="btnAddCalendar" title="Add Custom Calendar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>

        <!-- Dynamic List of Calendars (CRUD) -->
        <div class="calendars-list" id="calendarsList"></div>
      </div>

      <!-- Categories & Tag Filters -->
      <div class="sidebar-section">
        <div class="sidebar-header-row">
          <span class="sidebar-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            Tags &amp; Sprints
          </span>
        </div>
        <div class="tags-filter-list" id="tagsFilterList"></div>
      </div>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">
        <span id="totalEventsCountBadge">0 Events</span>
        <button class="btn btn-secondary btn-sm" id="btnResetData" style="font-size: 0.7rem; padding: 3px 8px;">Reset Default</button>
      </div>
    </aside>

    <!-- MAIN CALENDAR VIEWPORT -->
    <main class="cal-main-viewport">
      <!-- Active Filter Status Bar -->
      <div class="filter-status-bar" id="filterStatusBar">
        <div class="active-filters-chips" id="filterChipsContainer"></div>
        <div style="font-family: var(--font-mono); font-size: 0.72rem;">
          Press <kbd style="background: rgba(255,255,255,0.08); padding: 1px 4px; border-radius: 3px;">N</kbd> for new event · <kbd style="background: rgba(255,255,255,0.08); padding: 1px 4px; border-radius: 3px;">T</kbd> for today
        </div>
      </div>

      <!-- Dynamic Calendar Container -->
      <div class="cal-view-container" id="calViewContainer"></div>
    </main>

  </div>

  <!-- ==========================================================================
       MODALS
       ========================================================================== -->

  <!-- 1. CREATE / CUSTOMIZE CALENDAR MODAL -->
  <div class="modal-overlay" id="calendarModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="calendarModalTitle">
          <span>🎨</span> Create New Calendar
        </h3>
        <button class="modal-close-btn" data-close-modal>×</button>
      </div>
      <form id="calendarForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="calNameInput">Calendar Label / Name *</label>
            <input type="text" class="form-input" id="calNameInput" placeholder="e.g. Content Sprints, Client Milestones..." required>
          </div>

          <div class="form-group">
            <label class="form-label">Color Theme Accent</label>
            <div class="color-picker-grid" id="colorSwatchesGrid"></div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px;">
              <span style="font-size: 0.72rem; color: var(--text-muted);">Custom HEX:</span>
              <input type="text" class="form-input" id="calColorInput" style="width: 110px; padding: 4px 8px; font-family: var(--font-mono); font-size: 0.76rem;" value="#3b82f6">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Calendar Icon Badge</label>
            <div class="icon-picker-grid" id="iconPickerGrid"></div>
            <input type="hidden" id="calIconInput" value="📅">
          </div>

          <div class="form-group">
            <label class="form-label" for="calDescInput">Description / Scope Notes</label>
            <textarea class="form-textarea" id="calDescInput" placeholder="Briefly describe what tasks and events belong to this calendar..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Calendar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. CREATE / EDIT EVENT MODAL -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="eventModalTitle">
          <span>📅</span> Create New Event
        </h3>
        <button class="modal-close-btn" data-close-modal>×</button>
      </div>
      <form id="eventForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="evtTitleInput">Event Title *</label>
            <input type="text" class="form-input" id="evtTitleInput" placeholder="e.g. Q4 Sprint Planning / Client Review" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="evtCalSelect">Assigned Calendar *</label>
            <select class="form-select" id="evtCalSelect" required></select>
          </div>

          <div class="form-group-row">
            <div class="form-group">
              <label class="form-label" for="evtStartDateInput">Start Date *</label>
              <input type="date" class="form-input" id="evtStartDateInput" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="evtStartTimeInput">Start Time</label>
              <input type="time" class="form-input" id="evtStartTimeInput" value="10:00">
            </div>
          </div>

          <div class="form-group-row">
            <div class="form-group">
              <label class="form-label" for="evtEndDateInput">End Date</label>
              <input type="date" class="form-input" id="evtEndDateInput">
            </div>
            <div class="form-group">
              <label class="form-label" for="evtEndTimeInput">End Time</label>
              <input type="time" class="form-input" id="evtEndTimeInput" value="11:00">
            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 8px;">
            <input type="checkbox" id="evtAllDayCheckbox" style="cursor: pointer;">
            <label for="evtAllDayCheckbox" style="font-size: 0.78rem; color: var(--text-primary); cursor: pointer;">All-Day Event</label>
          </div>

          <div class="form-group-row">
            <div class="form-group">
              <label class="form-label" for="evtPrioritySelect">Priority Level</label>
              <select class="form-select" id="evtPrioritySelect">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High" selected>High</option>
                <option value="Urgent">Urgent 🔥</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="evtCategoryInput">Category / Sprint Tag</label>
              <input type="text" class="form-input" id="evtCategoryInput" placeholder="e.g. Sprint, Content, SEO, Client">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="evtLocationInput">Location / Meeting Link</label>
            <input type="text" class="form-input" id="evtLocationInput" placeholder="e.g. Google Meet, Zoom, Studio A">
          </div>

          <div class="form-group">
            <label class="form-label" for="evtAttendeesInput">Assignees / Attendees</label>
            <input type="text" class="form-input" id="evtAttendeesInput" placeholder="e.g. Alex, Maria, Dave">
          </div>

          <div class="form-group">
            <label class="form-label" for="evtDescInput">Description &amp; Agenda</label>
            <textarea class="form-textarea" id="evtDescInput" placeholder="Add detailed sprint deliverables, action items, or meeting agenda..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. EVENT DETAILS MODAL -->
  <div class="modal-overlay" id="eventDetailsModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Event Overview</h3>
        <button class="modal-close-btn" data-close-modal>×</button>
      </div>
      <div class="modal-body" id="eventDetailsBody"></div>
      <div class="modal-footer" style="justify-content: space-between;">
        <button type="button" class="btn btn-danger" id="btnDeleteFromDetails">Delete</button>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-secondary" data-close-modal>Close</button>
          <button type="button" class="btn btn-primary" id="btnEditFromDetails">Edit Event</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. DELETE CALENDAR SAFETY MODAL -->
  <div class="modal-overlay" id="deleteCalModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" style="color: var(--brand-rose);">⚠️ Delete Calendar</h3>
        <button class="modal-close-btn" data-close-modal>×</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.88rem; color: var(--text-primary); margin-bottom: 12px;">
          Are you sure you want to delete calendar <b id="deleteCalNameSpan" style="color: #fff;"></b>?
        </p>
        <div class="form-group">
          <label class="form-label" for="deleteCalReassignSelect">What should happen to existing events?</label>
          <select class="form-select" id="deleteCalReassignSelect"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal>Cancel</button>
        <button type="button" class="btn btn-danger" id="btnConfirmDeleteCal">Delete Calendar</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Hub -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="calendar.js"></script>
</body>
</html>
